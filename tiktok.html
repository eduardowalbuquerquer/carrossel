<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autorização TikTok · Forja da Alma</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#171411;background:#FBF7F0}h1{font-family:Georgia,serif}h2{margin-top:28px}a{color:#9A6618}.box{background:#fff;border:1px solid #e6dccb;border-radius:10px;padding:16px;word-break:break-all;font-family:monospace;font-size:15px}</style></head><body><h1>Autorização do TikTok</h1><p id="msg">Lendo o retorno do TikTok…</p><div class="box" id="code"></div><p id="hint"></p>
<script>
const p=new URLSearchParams(location.search);const c=p.get('code'),e=p.get('error');
if(c){document.getElementById('msg').textContent='Autorização concedida. Copie o código abaixo e envie para o Claude na thread:';document.getElementById('code').textContent=c;document.getElementById('hint').textContent='O código vale por poucos minutos. Envie logo depois de copiar.';}
else if(e){document.getElementById('msg').textContent='O TikTok retornou um erro: '+e+' '+(p.get('error_description')||'');document.getElementById('code').style.display='none';}
else{document.getElementById('msg').textContent='Esta página recebe o retorno da autorização do TikTok para o Forja da Alma. Nenhum código foi recebido.';document.getElementById('code').style.display='none';}
</script></body></html>
